<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comparador 29N</title>
<meta name="description" content="Compara las propuestas de cada partido para las elecciones generales del 29 de noviembre de 2026 y contrasta sus promesas con hechos documentados.">
<style>
:root{
  color-scheme:light dark;
  --bg:#f3f4f7; --card:#fff; --ink:#0e1218; --ink2:#465064; --ink3:#7d8697; --line:#e3e6ec; --soft:#eef0f4;
  --n0:#b03a27; --n1:#c25e14; --n2:#987506; --n3:#13807a; --n4:#2163ad;
  --sh:0 1px 2px rgba(14,18,24,.05),0 10px 28px -14px rgba(14,18,24,.22);
  --r:18px; --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d0f13; --card:#171a20; --ink:#f1f3f6; --ink2:#b3bac7; --ink3:#808998; --line:#2a2e37; --soft:#1f232b;
    --n0:#ee7b65; --n1:#f09a52; --n2:#dcc04f; --n3:#4fc9bd; --n4:#6aa8ea;
    --sh:0 1px 2px rgba(0,0,0,.4),0 14px 34px -14px rgba(0,0,0,.7);}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
a{color:inherit;text-underline-offset:3px}
h1,h2,h3,h4{margin:0;line-height:1.15;letter-spacing:-.022em;font-weight:780}
p{margin:0}
:focus-visible{outline:2.5px solid var(--n4);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.wrap{max-width:1160px;margin:0 auto;padding:0 18px}
.num{font-variant-numeric:tabular-nums}

/* Cabecera y navegación */
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:56px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.05rem;text-decoration:none;letter-spacing:-.02em}
.logo b{background:var(--ink);color:var(--bg);padding:3px 8px;border-radius:8px;font-size:.92rem}
.cuenta{font-size:.8rem;color:var(--ink3);font-weight:600;margin-left:2px}
nav.tabs{display:flex;gap:2px;margin-left:auto}
nav.tabs a{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;text-decoration:none;color:var(--ink2);font-weight:650;font-size:.92rem}
nav.tabs a svg{width:18px;height:18px;flex:none}
nav.tabs a[aria-current=page]{background:var(--ink);color:var(--bg)}
nav.tabs a:hover:not([aria-current=page]){background:var(--soft)}
@media (max-width:760px){
  header.top{backdrop-filter:none;background:var(--bg)}
  .top .wrap{height:50px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  nav.tabs a{flex:1;flex-direction:column;gap:2px;font-size:.68rem;padding:5px 2px;border-radius:12px;font-weight:700}
  nav.tabs a svg{width:22px;height:22px}
  nav.tabs a[aria-current=page]{background:none;color:var(--ink)}
  nav.tabs a:not([aria-current=page]){color:var(--ink3)}
  main{padding-bottom:84px}
  .cuenta{margin-left:auto}
}

/* Cabeceras de sección */
.cab{padding:26px 0 14px}
.cab h1{font-size:clamp(1.55rem,4.4vw,2.3rem)}
.cab p{color:var(--ink2);margin-top:6px;max-width:56ch}
.kick{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--ink3);margin-bottom:8px}
.etq{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:800}

/* Inicio */
.hero{padding:38px 0 8px;text-align:center}
.hero h1{font-size:clamp(2rem,7vw,3.6rem);letter-spacing:-.04em;line-height:1.02}
.hero h1 span{color:var(--ink3)}
.hero p{color:var(--ink2);margin:12px auto 0;max-width:40ch;font-size:1.05rem}
.puertas{display:grid;gap:14px;grid-template-columns:repeat(3,1fr);margin:28px 0 8px}
@media (max-width:860px){.puertas{grid-template-columns:1fr}}
.puerta{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;text-decoration:none;box-shadow:var(--sh);transition:transform .16s,border-color .16s;min-height:210px}
.puerta:hover{transform:translateY(-3px);border-color:var(--ink3)}
.puerta .n{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.puerta h2{font-size:1.35rem}
.puerta .vis{margin-top:auto;padding-top:8px}
.puerta .ir{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.9rem;color:var(--ink2);padding-top:10px;border-top:1px solid var(--line)}
.puerta .ir i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.mini-p{display:flex;flex-wrap:wrap;gap:5px}
.mini-p span{font-size:.7rem;font-weight:800;padding:3px 7px;border-radius:6px;background:var(--c);color:var(--t)}
.mini-tira{position:relative;height:34px;border-radius:10px;background:linear-gradient(90deg,color-mix(in srgb,var(--n0) 22%,transparent) 0 25%,color-mix(in srgb,var(--n1) 22%,transparent) 25% 45%,color-mix(in srgb,var(--n2) 22%,transparent) 45% 60%,color-mix(in srgb,var(--n3) 22%,transparent) 60% 75%,color-mix(in srgb,var(--n4) 22%,transparent) 75%)}
.mini-tira i{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:var(--c);transform:translate(-50%,-50%);box-shadow:0 0 0 1.5px var(--card)}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 12px}
.sec-t h2{font-size:1.2rem}

/* Temas */
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tema{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;font-weight:680;font-size:.92rem;line-height:1.2;transition:border-color .15s,background .15s}
.tema .ico{width:34px;height:34px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:1.15rem;flex:none}
.tema:hover{border-color:var(--ink3)}
.tema[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tema[aria-pressed=true] .ico{background:color-mix(in srgb,var(--bg) 18%,transparent)}
.barra{position:sticky;top:56px;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);margin:0 -18px;padding:8px 0;border-bottom:1px solid var(--line)}
.barra.suelta{position:static;background:none;backdrop-filter:none;border-bottom:0;padding:4px 0 2px}
.barra .temas{display:flex;overflow-x:auto;scrollbar-width:none;padding:2px 18px;gap:8px;scroll-padding:0 18px}
.barra .temas::-webkit-scrollbar{display:none}
.barra .tema{flex:none;padding:7px 12px 7px 7px;border-radius:999px;font-size:.88rem;white-space:nowrap}
.barra .tema .ico{width:28px;height:28px;border-radius:50%;font-size:1rem}
@media (max-width:760px){.barra{top:50px}}

/* Partidos */
.pchips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.pc{display:inline-flex;align-items:center;gap:7px;padding:7px 13px 7px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:720;font-size:.88rem;color:var(--ink2);white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.pc i{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
.pc:hover{border-color:var(--c)}
.pc[aria-pressed=true]{background:var(--c);border-color:var(--c);color:var(--t)}
.pc[aria-pressed=true] i{background:var(--t);opacity:.9}
.pc.todos i{display:none}
.pc.todos{padding-left:13px}
.pc.todos[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px;flex:none}
@media (max-width:760px){.pchips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px;width:calc(100% + 36px)}.pchips::-webkit-scrollbar{display:none}.pc{flex:none}.herr .busca{flex:1 0 100%}}
.herr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 4px}
.txt{padding:8px 2px;font-weight:700;font-size:.84rem;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.txt:hover{text-decoration-color:currentColor}
.busca{flex:1;min-width:210px;display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:0 14px;height:42px}
.busca:focus-within{border-color:var(--ink)}
.busca input{flex:1;border:0;background:none;font:inherit;color:inherit;outline:0;min-width:0}
.busca svg{width:17px;height:17px;color:var(--ink3);flex:none}
select.sel{font:inherit;font-weight:700;font-size:.88rem;color:var(--ink2);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 12px;height:40px}

/* Comparar */
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));align-items:start;padding:14px 0 50px}
@media (max-width:760px){
  .cols.varias{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:84%;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:14px 18px 30px;scrollbar-width:none}
  .cols.varias::-webkit-scrollbar{display:none}
  .cols.varias .col{scroll-snap-align:center}
}
.col{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.col>header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:var(--c);color:var(--t)}
.col h2{font-size:1.05rem}
.col header span{font-size:.76rem;font-weight:750;opacity:.9;white-space:nowrap}
.prop{border-top:1px solid var(--line)}
.prop:first-of-type{border-top:0}
.prop summary{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 16px;cursor:pointer;list-style:none;font-weight:650;font-size:.95rem;line-height:1.3}
.prop summary::-webkit-details-marker{display:none}
.prop summary:hover{background:var(--soft)}
.prop summary .t{flex:1}
.prop summary .tm{display:block;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.chev{width:18px;height:18px;color:var(--ink3);flex:none;transition:transform .2s}
details[open]>summary .chev{transform:rotate(180deg)}
.prop .det{padding:0 16px 16px;font-size:.93rem;color:var(--ink2)}
.cita{margin:10px 0 6px;padding:10px 12px;border-radius:12px;background:var(--soft);color:var(--ink);font-size:.92rem;border-left:3px solid var(--c,var(--ink3))}
.fte{font-size:.8rem;color:var(--ink3)}
.fte a{font-weight:700;color:var(--ink2)}
.concr{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 2px}
.concr span{font-size:.74rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--ink3)}
.concr span.si{background:color-mix(in srgb,var(--n3) 16%,transparent);color:var(--n3)}
.concr span.no{text-decoration:line-through}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:9px 14px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:750;font-size:.86rem}
.masprog{border-top:1px solid var(--line);background:var(--soft)}
.masprog>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;cursor:pointer;list-style:none;font-weight:750;font-size:.88rem;color:var(--ink2);min-height:44px}
.masprog>summary::-webkit-details-marker{display:none}
.masprog>summary b{color:var(--ink)}
.masprog[open]>summary .chev{transform:rotate(180deg)}
.masprog .lista{background:var(--card,var(--bg))}
.prop.mini summary{font-weight:560;font-size:.9rem;padding:10px 14px 10px 16px}
.masprog .otra{display:block;width:100%;padding:12px 16px;font-weight:750;font-size:.86rem;color:var(--ink2);border-top:1px solid var(--line);text-align:center;min-height:44px}
.masprog .otra:hover{background:var(--soft)}
.orig{font-size:.74rem;color:var(--ink3);margin-top:8px}
.vacio{padding:22px 16px;color:var(--ink3);font-size:.9rem;text-align:center}
.aviso{margin:18px 0 60px;padding:26px 18px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--ink2);text-align:center}
.pista-m{display:none;font-size:.78rem;color:var(--ink3);font-weight:650;margin-top:10px}
@media (max-width:760px){.pista-m{display:block}}

/* Anillo */
.ring{flex:none;display:block}
.ring text{font-family:var(--sans);font-variant-numeric:tabular-nums}

/* Nube de puntos */
.nube{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 16px 12px;margin:6px 0 4px}
.nfila{display:grid;grid-template-columns:86px 1fr;align-items:center;gap:10px}
.nfila+.nfila{margin-top:4px}
.nnom{display:flex;align-items:center;gap:7px;font-weight:760;font-size:.82rem;line-height:1.1}
.nnom i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.npista{position:relative;border-radius:10px;background:linear-gradient(90deg,color-mix(in srgb,var(--n0) 13%,transparent) 0 25%,color-mix(in srgb,var(--n1) 13%,transparent) 25% 45%,color-mix(in srgb,var(--n2) 13%,transparent) 45% 60%,color-mix(in srgb,var(--n3) 13%,transparent) 60% 75%,color-mix(in srgb,var(--n4) 13%,transparent) 75%)}
.ndot{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--c);transform:translateX(-50%);box-shadow:0 0 0 2px var(--card);transition:transform .12s}
.ndot::after{content:"";position:absolute;inset:-6px}
.ndot:hover,.ndot:focus-visible{transform:translateX(-50%) scale(1.35);z-index:2}
.neje{display:grid;grid-template-columns:86px 1fr;gap:10px;margin-top:6px}
.neje div{display:flex;font-size:.66rem;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.neje span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-top:5px;border-top:3px solid var(--k);margin-right:2px}
.nleg{min-height:1.5em;margin-top:10px;font-size:.86rem;color:var(--ink2);font-weight:600}
.nleg b{color:var(--ink)}
@media (max-width:560px){.nube{padding:12px 10px 10px}.nfila,.neje{grid-template-columns:62px 1fr;gap:6px}.nnom{font-size:.74rem;gap:5px}.ndot{width:18px;height:18px;box-shadow:0 0 0 1.5px var(--card)}.ndot::after{inset:-7px}}

/* Tarjetas */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));padding:14px 0 50px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:12px;transition:transform .15s,border-color .15s;width:100%}
.card:hover{transform:translateY(-3px);border-color:var(--ink3)}
.card .sup{display:flex;align-items:center;gap:8px;font-size:.76rem;font-weight:750;color:var(--ink3)}
.tag{display:inline-flex;align-items:center;padding:3px 8px;border-radius:7px;background:var(--c);color:var(--t);font-size:.72rem;font-weight:800;letter-spacing:.01em}
.card .mid{display:flex;gap:14px;align-items:center}
.card h3{font-size:1.02rem;line-height:1.25;font-weight:740}
.card .inf{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.evbar{display:flex;gap:3px;height:7px}
.evbar i{border-radius:99px;background:var(--k);min-width:5px}
.evtxt{display:flex;justify-content:space-between;font-size:.76rem;font-weight:700;color:var(--ink3)}
.evtxt b{color:var(--k)}

/* Balance */
.pila{display:flex;gap:4px;height:66px;margin:8px 0 10px}
.pila button{border-radius:12px;background:var(--k);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:820;font-size:1.3rem;line-height:1;min-width:62px;transition:opacity .15s,transform .15s}
@media (prefers-color-scheme:dark){.pila button{color:#0d0f13}}
.pila button small{font-size:.64rem;font-weight:800;opacity:.92;margin-top:3px;text-align:center;line-height:1.05;padding:0 4px}
.pila.filtrada button[aria-pressed=false]{opacity:.28}
.pila button:hover{transform:translateY(-2px)}
.est{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:820;color:var(--k)}
.est i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--k);color:var(--card);display:grid;place-items:center;font-size:.8rem;font-weight:900}
.card .ahora{display:flex;align-items:center;gap:10px;font-size:.8rem;font-weight:700;color:var(--ink3);padding-top:10px;border-top:1px solid var(--line)}
.card .ahora b{color:var(--ink);display:block}

/* España en datos */
.conm{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:2px;margin:0 0 14px}
.conm a{padding:9px 16px;border-radius:999px;font-weight:760;font-size:.9rem;text-decoration:none;color:var(--ink2);white-space:nowrap}
.conm a[aria-current=true]{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.dgrupo{margin:22px 0 8px;display:flex;align-items:baseline;gap:10px}
.dgrupo h2{font-size:1.05rem}
.dgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.dato{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.dato h3{font-size:.95rem;font-weight:740;line-height:1.25}
.dato .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px}
.dato .v small{display:block;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.dato .v b{font-size:1.45rem;font-weight:820;letter-spacing:-.03em;line-height:1.1}
.dato .v b span{font-size:.72rem;font-weight:700;color:var(--ink3);letter-spacing:0;margin-left:2px}
.dato .v.antes b{color:var(--ink3)}
.dato .fl{color:var(--ink3);font-size:1.1rem;padding-bottom:3px}
.cambio{display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:12px;padding:8px 11px;background:color-mix(in srgb,var(--k) 13%,transparent);color:var(--k);font-weight:820}
.cambio .p{font-size:1.05rem}
.cambio .e{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase}
.dato details summary{cursor:pointer;list-style:none;font-size:.76rem;font-weight:700;color:var(--ink3)}
.dato details summary::-webkit-details-marker{display:none}
.dato details p{font-size:.82rem;color:var(--ink2);margin-top:6px}

.ojo{display:flex;gap:7px;align-items:flex-start;font-size:.8rem;font-weight:620;line-height:1.35;color:var(--ink);background:color-mix(in srgb,var(--n2) 16%,transparent);border-radius:10px;padding:8px 10px}
.ojo::before{content:"⚠";flex:none;color:var(--n1)}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));margin-bottom:6px}
.fcard{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-height:128px;transition:transform .15s}
.fcard:hover{transform:translateY(-3px)}
.fcard .b{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.fcard h3{font-size:1.05rem;line-height:1.25}
.fcard .ir{margin-top:auto;font-size:.8rem;font-weight:700;opacity:.85}
.detras{align-self:flex-start;font-size:.8rem;font-weight:750;color:var(--ink);background:var(--soft);border-radius:999px;padding:7px 12px;min-height:32px}
.detras:hover{background:var(--line)}
.concl{font-size:1.08rem;font-weight:650;line-height:1.4;color:var(--ink)}
.relato{border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--ink2);font-style:italic}
.ojos{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.tabla-f{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:10px}

<script>
const D = /*__DATOS__*/null;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url = u => /^https?:\/\//i.test(u || '') ? esc(u) : '#';
const P = Object.fromEntries(D.partidos.map(p => [p.id, p]));
const T = Object.fromEntries(D.temas.map(t => [t.id, t.nombre]));
const CPORPROP = Object.fromEntries(D.contrastes.map(c => [c.propuesta_id, c]));
const PROP = Object.fromEntries(D.propuestas.map(p => [p.id, p]));
const ICO = {vivienda:'🏠', impuestos:'💶', empleo:'💼', pensiones:'🧓', sanidad:'🏥', educacion:'🎓', inmigracion:'🛂', seguridad:'⚖️', igualdad:'🤝', energia:'🌱', corrupcion:'🔎', instituciones:'🏛️', territorio:'🗺️', exterior:'🌍'};
const TCORTO = {impuestos:'Impuestos', empleo:'Empleo', seguridad:'Seguridad', igualdad:'Igualdad', energia:'Energía y campo', instituciones:'Instituciones', territorio:'Territorio', exterior:'Exterior'};
const tnom = id => TCORTO[id] || T[id] || '';
const nivelColor = v => v >= 75 ? 'var(--n4)' : v >= 60 ? 'var(--n3)' : v >= 45 ? 'var(--n2)' : v >= 25 ? 'var(--n1)' : 'var(--n0)';
const sobre = h => { const n = parseInt(String(h).slice(1), 16), l = [n >> 16, n >> 8 & 255, n & 255].map(v => (v /= 255) <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4), L = .2126 * l[0] + .7152 * l[1] + .0722 * l[2]; return 1.05 / (L + .05) >= (L + .05) / .0596 ? '#fff' : '#14171c'; };
const pcol = p => `--c:${p.color};--t:${sobre(p.color)}`;
const SENT = {contradice: ['En contra', 'var(--n0)'], apoya: ['A favor', 'var(--n4)'], contexto: ['Contexto', 'var(--ink3)']};
const TIPO = {votacion:'Votación', norma:'Norma publicada', dato_oficial:'Dato oficial', resolucion_judicial:'Resolución judicial', procedimiento_judicial:'Procedimiento judicial', documento_partido:'Documento del partido', declaracion:'Declaración', informe_independiente:'Informe independiente', verificador:'Verificador', prensa:'Prensa'};
const JUD = {investigado:'Investigado, sin condena', procesado:'Procesado, sin condena', juicio:'En juicio, sin sentencia', condenado_no_firme:'Condena no firme', condenado_firme:'Condena firme', responsable_civil_firme:'Responsable civil, sentencia firme', absuelto:'Absuelto', archivado:'Archivado'};
const COMP = {historial:['Historial','Qué pasó cuando tuvieron poder para hacerlo'], viabilidad:['Viabilidad','Si depende de ellos o necesita mayorías, comunidades, Europa o dinero'], coherencia:['Coherencia','Si sus votos y actos van en la misma dirección que la promesa'], datos:['Datos','Qué dicen las cifras oficiales y los organismos independientes'], concrecion:['Concreción','Si el programa da cifra, plazo, financiación e instrumento']};
const EST = {cumplido:['Cumplido','var(--n4)','✓'], parcial:['A medias','var(--n2)','◐'], en_curso:['En curso','var(--ink3)','…'], incumplido:['Incumplido','var(--n1)','✕'], contrario:['Hizo lo contrario','var(--n0)','⇄']};
const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
const fechaLarga = f => { if(!f) return ''; const m = String(f).match(/^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?/); if(!m) return esc(f); const ms=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return (m[3]?+m[3]+' ':'')+(m[2]?ms[+m[2]-1]+' ':'')+m[1]; };
const guardar = (k, v) => { try { localStorage.setItem('c29n-' + k, JSON.stringify(v)); } catch (e) {} };
const leer = (k, d) => { try { const v = JSON.parse(localStorage.getItem('c29n-' + k)); return v ?? d; } catch (e) { return d; } };
const plano = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const FONDO = D.partidos.filter(p => p.n_contrastes);
const PROG = D.programa || [], PASO = 30;
const nmil = n => Number(n).toLocaleString('es-ES');
const fprog = p => { const m = String(p.programa.fecha || '').match(/^\d{4}(-\d{2})?(-\d{2})?/); return m ? ' (' + fechaLarga(m[0]) + ')' : ''; };

const S = {
  tema: leer('tema', 'vivienda'),
  sel: new Set((v => Array.isArray(v) ? v : D.partidos.filter(p => p.a_fondo).map(p => p.id))(leer('sel2', null)).filter(id => P[id])),
  q: '', fPartido: 'todos', fTema: 'todos', orden: 'partido', fEstado: 'todos'
};
if (!T[S.tema]) S.tema = 'vivienda';

const ring = (v, s = 46, w = 5) => { const r = (s - w) / 2, c = 2 * Math.PI * r, m = s / 2;
  return `<svg class="ring" width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" style="color:var(--ink)" role="img" aria-label="Plausibilidad ${v} sobre 100"><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${w}"/><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="${nivelColor(v)}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${(c * v / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${m} ${m})"/><text x="${m}" y="${m}" dy=".36em" text-anchor="middle" font-size="${(s * .34).toFixed(1)}" font-weight="820" fill="currentColor">${v}</text></svg>`; };
const tag = p => `<span class="tag" style="${pcol(p)}">${esc(p.corto)}</span>`;
const temaBtn = (t, attr, on) => `<button class="tema" ${attr}="${t.id}"${on === undefined ? '' : ` aria-pressed="${on}"`}><span class="ico" aria-hidden="true">${ICO[t.id] || '•'}</span><span>${esc(tnom(t.id))}</span></button>`;
const largo = (txt, n = 300) => String(txt || '').length > n ? `<p class="clamp">${esc(txt)}</p><button class="mas" data-mas>Leer más</button>` : `<p>${esc(txt)}</p>`;
const acord = (t, html, open) => html ? `<details class="acord"${open ? ' open' : ''}><summary>${t}${CHEV}</summary><div class="in">${html}</div></details>` : '';

/* ---------- Inicio ---------- */
function vInicio() {
  const cuenta = k => D.balance.filter(b => b.estado === k).length;
  return `<section class="hero">
    <h1>Lo que prometen.<br><span>Y lo que consta.</span></h1>
    <p>Programas, hechos y fuentes para decidir tu voto el 29 de noviembre.</p></section>
    <div class="puertas">
      <a class="puerta" href="#/comparar"><span class="n">1 · Propuestas</span><h2>¿Qué propone cada partido?</h2>
        <div class="vis"><div class="mini-p">${D.partidos.filter(p => p.n_propuestas).map(p => `<span style="${pcol(p)}">${esc(p.corto)}</span>`).join('')}</div></div>
        <div class="ir"><span>${PROG.length ? nmil(D.propuestas.length + PROG.length) + ' medidas' : D.propuestas.length + ' medidas'} · ${D.temas.length} temas</span><i aria-hidden="true">→</i></div></a>
      <a class="puerta" href="#/contraste"><span class="n">2 · Contraste</span><h2>¿Es creíble lo que prometen?</h2>
        <div class="vis"><div class="mini-tira">${D.contrastes.map(c => `<i style="left:${Math.min(97, Math.max(3, c.indice.valor))}%;--c:${P[c.partido].color}"></i>`).join('')}</div></div>
        <div class="ir"><span>${D.contrastes.length} promesas a prueba</span><i aria-hidden="true">→</i></div></a>
      <a class="puerta" href="#/balance"><span class="n">3 · Desde 2018</span><h2>¿Qué fue de lo que prometió Sánchez?</h2>
        <div class="vis"><div class="evbar" style="height:34px;gap:4px">${Object.entries(EST).map(([k, [, col]]) => cuenta(k) ? `<i style="flex:${cuenta(k)};--k:${col};border-radius:10px"></i>` : '').join('')}</div></div>
        <div class="ir"><span>${D.balance.length} compromisos revisados</span><i aria-hidden="true">→</i></div></a>
    </div>
    <div class="sec-t"><h2>Empieza por lo que te importa</h2></div>
    <div class="temas" style="padding-bottom:50px">${D.temas.map(t => temaBtn(t, 'data-ir-tema')).join('')}</div>`;
}

/* ---------- Comparar ---------- */
function vComparar() {
  const nac = D.partidos.filter(p => p.ambito === 'nacional'), terr = D.partidos.filter(p => p.ambito !== 'nacional');
  const chip = p => `<button class="pc" data-partido="${p.id}" aria-pressed="${S.sel.has(p.id)}" style="${pcol(p)}"><i></i>${esc(p.corto)}</button>`;
  return `<section class="cab"><h1>¿Qué propone cada partido?</h1></section>
